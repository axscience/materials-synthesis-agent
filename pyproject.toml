[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "materials-synthesis-agent"
version = "0.2.0"
description = "Literature-informed, Bayesian-optimization-driven agent for closed-loop materials synthesis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "materials-synthesis-agent contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "anthropic>=0.34",
    "rdkit>=2024.3",
    # torch 2.2.x is compiled against the NumPy 1.x ABI; scipy>=1.13 requires NumPy>=2.0.
    # Until a torch build against NumPy 2 is available in your install environment, numpy and
    # scipy are pinned below torch's compatibility ceiling. Revisit this pin once torch>=2.3
    # is installable -- it's an environment constraint, not a design choice.
    "torch>=2.2,<2.3",
    "numpy>=1.26,<2",
    "scipy>=1.11,<1.13",
    "botorch>=0.11",
    "gpytorch>=1.11",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# aizynthfinder pulls in numba unconstrained (via its `paretoset` dependency), and pip resolves
# that to the newest numba, which requires llvmlite==0.49.x -- a version with no prebuilt wheel
# for Intel macOS, forcing a from-source build that needs the LLVM toolchain (llvm-config) to
# compile. Pinning numba<0.61 makes pip resolve to numba 0.60.0 -> llvmlite 0.43.0, which DOES
# have a real Intel-macOS wheel, avoiding the source build entirely. Confirmed by direct testing:
# `pip install aizynthfinder` alone fails here; `pip install aizynthfinder "numba<0.61"` resolves
# to all-wheels, no compiler needed.
retrosynthesis = ["aizynthfinder>=4.0", "numba<0.61"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "respx>=0.21", "httpx>=0.27"]

[project.scripts]
materials-agent = "materials_synthesis_agent.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/materials_synthesis_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
